<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodeDrills">
  <title>CodeDrills</title>
  <defs>
    <linearGradient id="cd-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6cb3"/>
      <stop offset="1" stop-color="#263961"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cd-tile)"/>
  <!-- Square brackets: a test case -->
  <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 13 H13 V51 H21"/>
    <path d="M43 13 H51 V51 H43"/>
  </g>
  <!-- Gold check: the test passes -->
  <path d="M22 33 L29 40 L42 24" fill="none" stroke="#f5c542" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
